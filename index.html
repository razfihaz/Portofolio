<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Portfolio Design Card - DKV SMK Tunas Media</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="main-header">
        <h1>DKV Creative Showcase</h1>
        <p>Latihan Praktikum CSS Box Model & Custom Styling</p>
    </header>

    <main class="container">

        <!-- Kartu Portofolio Visual -->
        <div class="card">

            <img 
                src="https://www.menpan.go.id/site/images/logo/Logo_PANRB_Vertical.png" width="150" height="150"
                alt="Desain Logo"
                class="card-img"
            >

            <div class="card-body">

                <span class="badge-category">
                    Branding Visual
                </span>

                <h2 class="card-title">
                    Redesain Identitas Logo UMKM
                </h2>

                <p class="card-text">
                    Pembuatan logo berbasis geometri vektor menggunakan
                    Adobe Illustrator dengan konsep modern & minimalis.
                </p>

                <a href="#" class="btn-detail">
                    Lihat Detail Karya
                </a>

            </div>

        </div>

    </main>

</body>
</html>
